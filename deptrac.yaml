deptrac:
    paths:
        - ./src
    exclude_files:
        - '#src/Kernel\.php#'
        - '#src/Shared/Infrastructure/Persistence/#'
    layers:
        - name: Domain
          collectors:
              - type: classLike
                value: '^App\\.*\\Domain\\'
        - name: Application
          collectors:
              - type: classLike
                value: '^App\\.*\\Application\\'
        - name: Infrastructure
          collectors:
              - type: classLike
                value: '^App\\.*\\Infrastructure\\'
        - name: Framework
          collectors:
              - type: classLike
                value: '^(Symfony\\(?!Component\\Uid\\)|Doctrine\\|MercadoPago\\|Dompdf\\|Endroid\\)'
    ruleset:
        Domain:
            - Domain
        Application:
            - Application
            - Domain
        Infrastructure:
            - Infrastructure
            - Application
            - Domain
            - Framework
