# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Payment Providers
    App\Sale\Payment\Application\Resolver\PaymentProviderResolver:
        arguments:
            $mercadoPago: '@App\Sale\Payment\Infrastructure\Provider\MercadoPagoPaymentProvider'

    App\Sale\Payment\Infrastructure\Provider\MercadoPagoPaymentProvider:
        arguments:
            $accessToken: '%env(MERCADO_PAGO_ACCESS_TOKEN)%'

    # Image
    App\Shared\Application\Port\Image\ImageUploader:
        alias: App\Shared\Infrastructure\Image\ImgBBImageUploader

    App\Shared\Infrastructure\Image\ImgBBImageUploader:
        arguments:
            $apiKey: '%env(IMGBB_API_KEY)%'

    # Mailer
    App\Shared\Application\Port\Mailer\Mailer:
        alias: App\Shared\Infrastructure\Mailer\SymfonyMailer

    # Hash
    App\Account\User\Application\Port\Hash\PasswordHasher:
        alias: App\Account\User\Infrastructure\Hash\SymfonyPasswordHasher

    # Reset
    App\Account\User\Application\Port\Reset\PasswordResetter:
        alias: App\Account\User\Infrastructure\Reset\SymfonyPasswordResetter

    # Slug
    App\Catalog\Event\Application\Port\Slug\SlugGenerator:
        alias: App\Catalog\Event\Infrastructure\Slug\SymfonySlugGenerator

    # PDF
    App\Shared\Application\Port\Pdf\PdfGenerator:
        alias: App\Shared\Infrastructure\Pdf\Generate\PdfDocumentGenerator

    App\Shared\Application\Port\Pdf\PdfRenderer:
        alias: App\Shared\Infrastructure\Pdf\Render\DompdfPdfRenderer

    App\Shared\Application\Port\Pdf\PdfStorage:
        alias: App\Shared\Infrastructure\Pdf\Storage\LocalPdfStorage

    # Template
    App\Shared\Application\Port\Template\TemplateRenderer:
        alias: App\Shared\Infrastructure\Template\TwigTemplateRenderer

    # Twig
    App\Shared\Infrastructure\Twig\TicketplusExtension:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Shared\Application\Transaction\TransactionService:
        alias: App\Shared\Infrastructure\Persistence\Doctrine\TransactionManager

    App\Shared\Application\Security\CurrentActor:
        alias: App\Shared\Infrastructure\Security\SymfonyCurrentActor

    App\Shared\Application\Bus\CommandBus:
        alias: App\Shared\Infrastructure\Messenger\SymfonyCommandBus

    App\Shared\Application\Bus\QueryBus:
        alias: App\Shared\Infrastructure\Messenger\SymfonyQueryBus

    App\Shared\Application\Bus\EventBus:
        alias: App\Shared\Infrastructure\Messenger\SymfonyEventBus

    App\Shared\Infrastructure\Messenger\SymfonyCommandBus:
        arguments:
            $commandBus: '@command_bus'

    App\Shared\Infrastructure\Messenger\SymfonyQueryBus:
        arguments:
            $queryBus: '@query_bus'

    App\Shared\Infrastructure\Messenger\SymfonyEventBus:
        arguments:
            $eventBus: '@event_bus'

    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
