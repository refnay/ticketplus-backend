framework:
    messenger:
        default_bus: command_bus
        buses:
            command_bus:
                middleware:
                    - doctrine_transaction
            event_bus:
                middleware:
                    - doctrine_transaction

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            sync: 'sync://'

        routing:
            App\Account\Company\Domain\Events\CompanyCreatedEvent: async

