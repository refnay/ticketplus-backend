order-create:
    path: /api/order
    controller: App\Sale\Order\Infrastructure\Controller\OrderCreateController::create
    methods: POST

order-approved-sales-summary-report:
    path: /api/order/report/approved-sales-summary
    controller: App\Sale\Order\Infrastructure\Controller\OrderApprovedSalesSummaryReportController::report
    methods: GET

order-paid-summary-report:
    path: /api/order/report/paid-summary
    controller: App\Sale\Order\Infrastructure\Controller\OrderApprovedSalesSummaryReportController::report
    methods: GET

order-paid-count-summary-report:
    path: /api/order/report/paid-count-summary
    controller: App\Sale\Order\Infrastructure\Controller\OrderPaidCountSummaryReportController::report
    methods: GET

order-cancel:
    path: /api/order/{id}
    controller: App\Sale\Order\Infrastructure\Controller\OrderCancelController::cancel
    methods: DELETE
