event-create:
    path: /api/event
    controller: App\Catalog\Event\Infrastructure\Controller\EventCreateController::create
    methods: POST

event-search:
    path: /api/event
    controller: App\Catalog\Event\Infrastructure\Controller\EventSearchController::search
    methods: GET

event-find:
    path: /api/event/{id}
    controller: App\Catalog\Event\Infrastructure\Controller\EventFindController::find
    methods: GET

event-update:
    path: /api/event/{id}
    controller: App\Catalog\Event\Infrastructure\Controller\EventUpdateController::update
    methods: PUT

event-delete:
    path: /api/event/{id}
    controller: App\Catalog\Event\Infrastructure\Controller\EventDeleteController::delete
    methods: DELETE

event-quick-update-general:
    path: /api/event/{id}/quick-update/general
    controller: App\Catalog\Event\Infrastructure\Controller\EventQuickUpdateGeneralController::update
    methods: PATCH

event-quick-update-location:
    path: /api/event/{id}/quick-update/location
    controller: App\Catalog\Event\Infrastructure\Controller\EventQuickUpdateLocationController::update
    methods: PATCH

event-cover-image-upload:
    path: /api/event/{id}/cover
    controller: App\Catalog\Event\Infrastructure\Controller\EventCoverImageUploadController::upload
    methods: POST

event-quick-update-schedule:
    path: /api/event/{id}/quick-update/schedule
    controller: App\Catalog\Event\Infrastructure\Controller\EventQuickUpdateScheduleController::update
    methods: PATCH

event-day-create:
    path: /api/event/{id}/day
    controller: App\Catalog\Event\Infrastructure\Controller\EventDayCreateController::create
    methods: POST

event-day-delete:
    path: /api/event/{id}/day/{dayId}
    controller: App\Catalog\Event\Infrastructure\Controller\EventDayDeleteController::delete
    methods: DELETE

event-day-update:
    path: /api/event/{id}/day/{dayId}
    controller: App\Catalog\Event\Infrastructure\Controller\EventDayUpdateController::update
    methods: PUT

event-banner-image-upload:
    path: /api/event/{id}/banner
    controller: App\Catalog\Event\Infrastructure\Controller\EventBannerImageUploadController::upload
    methods: POST

event-logo-upload:
    path: /api/event/{id}/logo
    controller: App\Catalog\Event\Infrastructure\Controller\EventLogoUploadController::upload
    methods: POST

event-thumbnail-upload:
    path: /api/event/{id}/thumbnail
    controller: App\Catalog\Event\Infrastructure\Controller\EventThumbnailUploadController::upload
    methods: POST
