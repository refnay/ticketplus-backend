"register":
    path: /register
    controller: App\Identity\User\Infrastructure\Controller\UserRegisterController::create
    methods:
        - POST

"login":
    path: /login
    controller: App\Identity\User\Infrastructure\Controller\UserLoginController::login
    methods:
        - POST

"password-recovery-send-email":
    path: /recovery/email
    controller: App\Identity\User\Infrastructure\Controller\UserPasswordSendRecoveryEmailController::send
    methods:
        - POST

"password-recovery-execute":
    path: /recovery/execute
    controller: App\Identity\User\Infrastructure\Controller\UserPasswordExecuteRecoveryController::create
    methods:
        - POST